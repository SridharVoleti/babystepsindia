name: PC-002 consent gate

on:
  pull_request:
  push:
    branches:
      - feature/pc-002-consent-management
      - master

permissions:
  contents: read

jobs:
  consent-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
