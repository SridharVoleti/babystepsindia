name: PC-001 privacy gate

on:
  pull_request:
  push:
    branches:
      - feature/pc-001-privacy-minimization
      - master

permissions:
  contents: read

jobs:
  privacy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:architecture
