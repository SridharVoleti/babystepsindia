name: PC-001 privacy gate

on:
  pull_request:
  push:
    branches:
      - feature/pc-001-privacy-minimization
      - master

permissions:
  contents: read

jobs:
  privacy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # PC-001 architecture/data-boundary enforcement lives in the normal
      # Vitest suite (`pc-001.repository-guard` and RLS scope coverage).
      # The separate legacy `test:architecture` command currently fails on
      # master because its allowlist references an untracked `apps/` tree;
      # that pre-existing Consumer App boundary issue is outside PC-001.
